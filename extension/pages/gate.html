<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closed for today</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gate">
  <div class="brand">Gatekeeper</div>
  <div id="closed" class="hidden">
    <div class="muted" id="site"></div>
    <h1 id="headline"></h1>
    <div class="meter"><div id="bar" style="width:100%"></div></div>
    <p class="muted" id="used"></p>
    <div class="goal" id="goal-box">
      <div class="muted">What you said you're working toward</div>
      <p id="goal"></p>
    </div>
    <div id="talk">
      <h2>Need it for something real?</h2>
      <div class="log" id="log"></div>
      <div id="consent" class="note hidden">
        <p id="consent-text"></p>
        <button class="primary" id="consent-yes" type="button">Yes, send it</button>
        <button class="link" id="consent-no" type="button">No</button>
      </div>
      <form id="form" class="ask">
        <textarea id="message" rows="2" maxlength="500" placeholder="Say what you need it for, in one go."></textarea>
        <button class="primary" id="send">Send</button>
      </form>
    </div>
    <p class="muted"><a href="rules.html" id="rules-link">Your rules</a>. A looser rule takes effect the next morning.</p>
  </div>
</main>
<script type="module" src="gate.js"></script>
</body>
</html>

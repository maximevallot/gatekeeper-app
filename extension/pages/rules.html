<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your rules · Gatekeeper</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <div class="row" style="padding: 0; align-items: flex-end">
    <h1 class="title">Your rules</h1>
    <span class="muted small" id="saved" aria-live="polite">Saved as you go</span>
  </div>

  <a class="btn wide" href="talk.html?from=rules" id="talk-link"></a>

  <div class="card rowblock hidden" id="exam-row">
    <div class="row" style="padding: 0">
      <div class="stack"><div class="name" id="exam-title"></div><div class="sub" id="exam-goal"></div></div>
      <button class="link" type="button" id="exam-end-open">End early</button>
    </div>
    <form class="section hidden" id="exam-form" style="gap: 8px">
      <label for="exam-sentence" class="small muted" id="exam-hint"></label>
      <div class="inline">
        <input class="field" id="exam-sentence" autocomplete="off">
        <button class="btn" type="submit">End exam mode</button>
      </div>
    </form>
  </div>

  <div class="section" id="daily">
    <h2>Daily time</h2>
    <div class="card" id="kinds"></div>
  </div>

  <div class="section">
    <h2>Settings</h2>
    <div class="card">
      <div class="rowblock" id="goal-row">
        <div class="row" style="padding: 0">
          <div class="stack"><div class="name">Working toward</div><div class="sub" id="goal-text"></div></div>
          <button class="link" type="button" id="goal-edit">Edit</button>
        </div>
        <form class="inline hidden" id="goal-form">
          <input class="field" id="goal" maxlength="300" autocomplete="off" aria-label="What you're working toward">
          <button class="btn" type="submit">Save</button>
        </form>
      </div>
      <div class="rowblock">
        <div class="row" style="padding: 0">
          <div class="stack">
            <div class="name">Claude help</div>
            <div class="sub" id="help-sub">Gate answers, rule changes by talking, sorting new sites.</div>
          </div>
          <label class="switch"><input type="checkbox" id="help" aria-label="Claude help"><span></span></label>
        </div>
        <div id="help-sent"></div>
      </div>
      <div class="row">
        <div class="stack"><div class="name">Private windows</div><div class="sub" id="private-sub"></div></div>
        <span class="pill" id="private-pill"></span>
      </div>
      <div class="row" id="mac-row">
        <div class="stack"><div class="name">Mac app</div><div class="sub" id="mac-sub"></div></div>
        <label class="switch"><input type="checkbox" id="mac" aria-label="Mac app"><span></span></label>
      </div>
      <div class="row">
        <div class="stack"><div class="name">Appearance</div></div>
        <div class="segmented" id="appearance">
          <button type="button" data-choice="light">Light</button><button type="button" data-choice="dark">Dark</button><button type="button" data-choice="system">Match Mac</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="rules.js"></script>
</body>
</html>
